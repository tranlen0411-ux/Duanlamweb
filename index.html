<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toán Cùng Em - Vương Quốc Trò Chơi Toán Học</title>
  <meta name="description" content="Nền tảng học tập số dành cho học sinh Cấp 1 tích hợp AI Ong Thông Thái.">
  
  <!-- Style Sheets -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/student.css">
  <link rel="stylesheet" href="assets/css/teacher.css">

  <style>
    .custom-game-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 99999;
    }
    .custom-game-backdrop.active { display: flex; }
    .leaderboard-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 999999;
    }
    .leaderboard-modal.active { display: flex !important; }
    .leaderboard-content {
      background: #fff; padding: 24px; border-radius: 24px; width: 480px; max-width: 90%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3); border: 3px solid #facc15;
    }
    .leaderboard-list-container { max-height: 280px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
  </style>
</head>
<body>

  <!-- 1. Thanh Điều Hướng Header Bar -->
  <header class="app-container" style="padding-bottom: 0;">
    <nav class="navbar" id="main-navbar">
      <div class="brand-logo">
        <img src="assets/images/mascot_bee.jpg" alt="Linh vật Ong" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #f59e0b; object-fit: cover;" />
        <svg width="150" height="42" viewBox="0 0 170 45" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="0" y="32" font-family="'Nunito', sans-serif" font-weight="900" font-size="26" fill="#F43F5E">Toán</text>
          <text x="60" y="32" font-family="'Nunito', sans-serif" font-weight="900" font-size="26" fill="#3B82F6">Cùng</text>
          <text x="120" y="32" font-family="'Nunito', sans-serif" font-weight="900" font-size="26" fill="#10B981">Em</text>
        </svg>

        <div class="header-class-selector" style="background: #fef08a; border: 1px solid #fde047; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px;">
          <span style="font-size: 14px;">🎓</span>
          <select id="global-class-select" onchange="handleClassChange(this.value)" style="background: transparent; border: none; font-weight: bold; color: #854d0e; font-size: 13px; cursor: pointer; outline: none;">
            <option value="2AI">Lớp 2 AI</option>
            <option value="2A">Lớp 2A</option>
            <option value="2B">Lớp 2B</option>
            <option value="2C">Lớp 2C</option>
          </select>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:12px;">
        <div class="header-stat-box"><span>⭐</span> <span id="user-coins-display">1250</span></div>
        <div class="header-xp-box"><span>⚡</span> <span id="user-xp-display">450 XP</span></div>

        <button id="btn-student-login" class="header-user-btn btn" onclick="openStudentLoginModal()" title="Nhấp để đổi tên học sinh">
          👶 Học sinh: <span id="user-name-display">Tú</span>
        </button>

        <button class="header-teacher-btn" id="role-switch-btn" onclick="openTeacherLoginModal()" title="Nhấp để đăng nhập hoặc đổi tài khoản Giáo viên">
          🏫 Giáo viên / Admin: <span id="teacher-name-display">Đăng nhập</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- 2. Thân Ứng Dụng Main Container -->
  <main class="app-container">
    <div id="student-view-container">
      <div class="hero-banner-blue hero-banner" style="position: relative; width: 100%; aspect-ratio: 1200 / 320; min-height: 280px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 0;">
        <div style="position: absolute; left: 0; top: 0; width: 50%; height: 100%; background-color: #f0f9ff; background-image: radial-gradient(#3b82f6 1.5px, transparent 1.5px); background-size: 20px 20px; z-index: 0;"></div>
        <div style="position: absolute; right: 0; top: 0; width: 50%; height: 100%; background-color: #fdf2f8; background-image: radial-gradient(#ec4899 1.5px, transparent 1.5px); background-size: 20px 20px; z-index: 0;"></div>

        <button class="btn-lam-bai-ngay" onclick="handleBannerButtonClick(event)" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); z-index: 10; background: linear-gradient(135deg, #ff8c00, #ff5500); color: white; font-weight: bold; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 85, 0, 0.35); display: flex; align-items: center; gap: 6px; white-space: nowrap;">
          📝 Làm Bài Ngay
        </button>

        <div style="position: relative; width: 100%; height: 100%; max-width: 1000px; margin: 0 auto; z-index: 1;">
          <img src="banner-moi.png" alt="Banner" style="width: 100%; height: 100%; object-fit: contain; display: block;" />
        </div>
      </div>

      <!-- THANH 4 TAB ĐIỀU HƯỚNG -->
      <div class="tab-navigation-bar">
        <button class="tab-nav-btn active" id="tab-btn-home" onclick="activatePanel('tab-home-tasks', this)">🏠 Trang Chủ & Nhiệm Vụ</button>
        <button class="tab-nav-btn" id="tab-btn-games" onclick="activatePanel('tab-game-arena', this)">🎮 Đấu Trường Trò Chơi</button>
        <button class="tab-nav-btn" id="tab-btn-ranking" onclick="openLeaderboardModal(this)">🏆 Bảng Xếp Hạng</button>
        <button class="tab-nav-btn" id="tab-btn-exam" onclick="activatePanel('tab-weekly-exam', this)">📝 Bài Thi Hằng Tuần</button>
        <button class="tab-nav-btn" id="tab-btn-history" onclick="activatePanel('tab-history-feedback', this)">📜 Lịch Sử & Nhận Xét</button>
      </div>

      <!-- TAB 1: TRANG CHỦ & NHIỆM VỤ -->
      <div class="tab-content-panel active" id="tab-home-tasks">
        <div class="home-tasks-grid">
          <div class="card-white-panel daily-tasks-card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3 style="font-size: 1.35rem; font-weight: 900; color: #0f172a; margin: 0;">🎯 Nhiệm Vụ Hàng Ngày</h3>
              <span class="reset-time" style="font-size: 0.88rem; color: var(--neutral-gray); font-weight: 700;">Reset sau: 14h 30m</span>
            </div>
            <div class="task-list" style="display: flex; flex-direction: column; gap: 14px;">
              <div style="background: #ffffff; padding: 20px 16px; border-radius: 16px; border: 2px solid #fef08a; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); min-height: 82px; box-sizing: border-box;">
                <div style="display: flex; align-items: center; gap: 12px;">
                  <div style="font-size: 32px;">🐝</div>
                  <div>
                    <div style="font-weight: bold; font-size: 14px; color: #422006; margin-bottom: 2px;">Hỏi Bài Bạn Ong AI</div>
                    <div style="font-size: 12px; color: #78350f;">Hỏi Bạn Ong 1 câu hỏi toán học (Thưởng: +25 XP, +5 ⭐️)</div>
                  </div>
                </div>
                <button style="background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap;" onclick="toggleBeeChat()">Làm ngay</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- POPUP MODAL BẢNG XẾP HẠNG HỌC SINH -->
  <div class="leaderboard-modal" id="leaderboard-modal">
    <div class="leaderboard-content" style="position: relative;">
      <button onclick="closeLeaderboardModal()" style="position: absolute; right: 16px; top: 16px; background: none; border: none; font-size: 24px; font-weight: bold; cursor: pointer; color: #64748b;">✕</button>
      <div style="text-align: center; margin-bottom: 16px;">
        <span style="font-size: 3rem;">🏆</span>
        <h3 style="font-size: 1.45rem; font-weight: 900; color: #1e293b; margin: 4px 0 0 0;">Bảng Xếp Hạng Học Sinh</h3>
      </div>
      <div class="leaderboard-list-container" id="leaderboard-list"></div>
      <button onclick="closeLeaderboardModal()" style="width: 100%; margin-top: 16px; padding: 12px; border-radius: 12px; font-weight: 900; background: linear-gradient(135deg, #ff7d29, #ea580c); border: none; color: white; cursor: pointer;">Đóng Bảng Xếp Hạng ✕</button>
    </div>
  </div>

  <!-- WIDGET TRỢ LÝ AI CHÚ ONG -->
  <div id="bee-ai-widget" style="position: fixed; bottom: 25px; right: 25px; z-index: 99999; font-family: 'Nunito', sans-serif;">
    <div id="bee-chat-box" style="display: none; width: 340px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; margin-bottom: 15px; border: 3px solid #facc15;">
      <div style="background: linear-gradient(135deg, #facc15, #eab308); color: #713f12; padding: 12px 15px; font-weight: bold; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 24px;">🐝</span><span>Trợ Lý Ong Chăm Chỉ</span></div>
        <button onclick="toggleBeeChat()" style="background: none; border: none; color: #713f12; font-size: 18px; font-weight: bold; cursor: pointer;">✕</button>
      </div>
      <div id="bee-chat-messages" style="height: 240px; padding: 12px; overflow-y: auto; background: #fefce8; font-size: 13px; display: flex; flex-direction: column; gap: 10px;">
        <div style="background: #ffffff; padding: 10px 12px; border-radius: 12px; border: 1px solid #fef08a; color: #422006;">👋 Chào bé! Bạn Ong Chăm Chỉ đây. Bé gửi phép tính để Ong giải giúp nhé!</div>
      </div>
      <div style="padding: 10px; background: #ffffff; border-top: 1px solid #fef08a; display: flex; gap: 8px;">
        <input type="text" id="bee-input" placeholder="Nhập phép tính..." style="flex: 1; padding: 8px 12px; border: 1px solid #fde047; border-radius: 20px; outline: none; font-size: 13px;" onkeypress="if(event.key==='Enter') sendBeeMessage()">
        <button onclick="sendBeeMessage()" style="background: #eab308; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer;">Gửi</button>
      </div>
    </div>
    <div onclick="toggleBeeChat()" style="width: 72px; height: 72px; background: linear-gradient(135deg, #fff066, #facc15); border: 4px solid #ffffff; border-radius: 50%; box-shadow: 0 8px 20px rgba(234, 179, 8, 0.5); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span style="font-size: 40px;">🐝</span>
    </div>
  </div>

  <!-- SCRIPT VÁ LỖI AN TOÀN CHO DBSTORE (CHỐNG CRASH APP.JS) -->
  <script>
    window.DBStore = window.DBStore || {};
    if (typeof window.DBStore.getUserProfile !== 'function') {
      window.DBStore.getUserProfile = function() {
        return { name: "Tú", coins: 1250, xp: 450, className: "2AI" };
      };
    }
  </script>

  <!-- App External Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db-store.js"></script>
  <script src="assets/js/ai-tutor.js"></script>
  <script src="assets/js/quiz-engine.js"></script>
  <script src="assets/js/game-engine.js"></script>
  <script src="assets/js/teacher-dashboard.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- LOGIC RIÊNG CHO BẢNG XẾP HẠNG & CHÚ ONG -->
  <script>
    window.openLeaderboardModal = function(btnEl) {
      document.querySelectorAll('.tab-nav-btn').forEach(btn => btn.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      const modal = document.getElementById("leaderboard-modal");
      if (modal) {
        modal.style.display = "flex";
        modal.classList.add("active");
        const listContainer = document.getElementById("leaderboard-list");
        if (listContainer) {
          let sampleList = [
            { name: "Vũ Bảo An", className: "Lớp 2 AI", xp: 2100 },
            { name: "Bé Nam (Con)", className: "Lớp 2 AI", xp: 1950 },
            { name: "Đỗ Hoàng Long", className: "Lớp 2 AI", xp: 1750 },
            { name: "Trần Tiến Đạt", className: "Lớp 2A", xp: 1500 },
            { name: "Nguyễn Văn A", className: "Lớp 2A", xp: 1200 }
          ];
          const badges = ["🥇", "🥈", "🥉"];
          listContainer.innerHTML = sampleList.map((item, index) => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; margin-bottom:8px; background:#f8fafc; border-radius:12px; border:1px solid #e2e8f0;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:1.15rem; font-weight:900;">${badges[index] || `#${index + 1}`}</span>
                <span style="font-weight:900; color:#1e293b; font-size:0.95rem;">${item.name}</span>
                <span style="font-size:11px; background:#e0f2fe; color:#0369a1; padding:2px 8px; border-radius:10px; font-weight:bold;">${item.className}</span>
              </div>
              <span style="color:#ea580c; font-weight:900; font-size:0.95rem;">${item.xp} XP</span>
            </div>
          `).join('');
        }
      }
    };

    window.closeLeaderboardModal = function() {
      const modal = document.getElementById("leaderboard-modal");
      if (modal) { modal.style.display = "none"; modal.classList.remove("active"); }
    };

    window.toggleBeeChat = function() {
      const chatBox = document.getElementById('bee-chat-box');
      if (chatBox) {
        chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'block' : 'none';
      }
    };

    window.sendBeeMessage = function() {
      const input = document.getElementById('bee-input');
      const msgContainer = document.getElementById('bee-chat-messages');
      if (!input || !msgContainer) return;
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.style.cssText = 'background: #eab308; color: white; padding: 8px 12px; border-radius: 12px; align-self: flex-end; max-width: 80%;';
      userMsg.textContent = text;
      msgContainer.appendChild(userMsg);
      input.value = '';
      msgContainer.scrollTop = msgContainer.scrollHeight;

      setTimeout(() => {
        const beeMsg = document.createElement('div');
        beeMsg.style.cssText = 'background: #ffffff; padding: 10px 12px; border-radius: 12px; border: 1px solid #fef08a; color: #422006; align-self: flex-start; max-width: 85%;';
        beeMsg.innerHTML = "🐝 Bạn Ong đã hiểu! Bé cố gắng luyện tập thật tốt nhé! 🌟";
        msgContainer.appendChild(beeMsg);
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }, 400);
    };
  </script>
</body>
</html>

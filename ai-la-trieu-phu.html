<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - Toán 6</title>
    <style>
        :root {
            --bg-dark-blue: #020111;
            --bg-blue: #0b103f;
            --bg-purple: #3a0d5c;
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --text-light: #ffffff;
            --btn-normal: linear-gradient(180deg, #0b103f 0%, #020111 100%);
            --btn-hover: linear-gradient(180deg, #1a237e 0%, #0b103f 100%);
            --btn-selected: linear-gradient(180deg, #ff8c00 0%, #8b4500 100%);
            --btn-correct: linear-gradient(180deg, #00b01d 0%, #00590e 100%);
            --btn-wrong: linear-gradient(180deg, #d50000 0%, #7f0000 100%);
            --border-normal: 2px solid #b8860b;
            --border-glow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-purple) 0%, var(--bg-dark-blue) 70%);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        canvas#fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        #start-screen, #end-screen {
            background: rgba(2, 1, 17, 0.85);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .title-icon {
            font-size: 60px;
            margin-bottom: 10px;
            text-shadow: var(--border-glow);
        }

        h1 {
            font-size: 3rem;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000, 0 0 20px var(--gold);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #b39ddb;
            font-weight: 300;
        }

        .btn-main {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: var(--btn-normal);
            border: var(--border-normal);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: var(--border-glow);
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-main:hover {
            background: var(--btn-hover);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
        }

        #game-screen {
            flex-direction: row;
            padding: 20px;
            gap: 20px;
            background: transparent;
        }

        .main-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .lifelines {
            display: flex;
            gap: 15px;
        }

        .lifeline-btn {
            width: 60px;
            height: 40px;
            border-radius: 20px;
            background: var(--btn-normal);
            border: var(--border-normal);
            color: var(--gold);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lifeline-btn:hover:not(:disabled) {
            background: var(--btn-hover);
            box-shadow: var(--border-glow);
        }

        .lifeline-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .timer-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-svg {
            position: absolute;
            transform: rotate(-90deg);
        }

        .timer-circle {
            fill: none;
            stroke: var(--gold);
            stroke-width: 6;
            stroke-dasharray: 226; /* 2 * PI * 36 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear;
        }

        .timer-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            z-index: 2;
        }

        .question-container {
            text-align: center;
            margin-top: 20px;
        }

        .question-box {
            background: var(--btn-normal);
            border: var(--border-normal);
            border-radius: 50px;
            padding: 20px 40px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1.5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            position: relative;
        }

        .question-box::before, .question-box::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 2px;
            background: var(--gold);
            z-index: -1;
        }
        .question-box::before { right: 100%; }
        .question-box::after { left: 100%; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .option-btn {
            background: var(--btn-normal);
            border: var(--border-normal);
            border-radius: 40px;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover { background: var(--btn-hover); }
        .option-btn.selected { background: var(--btn-selected); animation: blinkSelected 0.2s 5; }
        .option-btn.correct { background: var(--btn-correct); box-shadow: 0 0 20px #00ff00; }
        .option-btn.wrong { background: var(--btn-wrong); box-shadow: 0 0 20px #ff0000; }
        .option-btn.hidden-option { visibility: hidden; }

        .option-letter {
            color: var(--gold);
            font-weight: bold;
            margin-right: 15px;
            font-size: 1.3rem;
        }

        .money-tree {
            flex: 1;
            background: rgba(0, 0, 30, 0.6);
            border-left: 2px solid var(--bg-purple);
            padding: 20px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
            border-radius: 20px 0 0 20px;
            max-width: 250px;
        }

        .milestone {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            color: #aaa;
            transition: all 0.3s;
        }

        .milestone .m-num { width: 30px; text-align: right; margin-right: 15px;}
        .milestone .m-val { flex-grow: 1; text-align: left;}

        .milestone.safe { color: var(--text-light); font-weight: bold; }
        .milestone.current {
            background: var(--gold-dark);
            color: white;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--gold);
        }
        .milestone.passed { color: var(--gold); }

        @keyframes blinkSelected {
            0% { background: var(--btn-selected); }
            50% { background: var(--btn-normal); }
            100% { background: var(--btn-selected); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake-effect { animation: shake 0.5s; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--bg-blue), var(--bg-purple));
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-title {
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .modal-body {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Chart cho Hỏi khán giả */
        .chart-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 200px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #555;
        }
        .bar-group { display: flex; flex-direction: column; align-items: center; width: 40px;}
        .bar { width: 100%; background: var(--gold-dark); border-radius: 5px 5px 0 0; transition: height 1s ease-out; height: 0;}
        .bar-label { margin-top: 10px; font-weight: bold;}
        .bar-pct { margin-bottom: 5px; font-size: 0.9rem;}

        @media (max-width: 900px) {
            #game-screen { flex-direction: column; }
            .money-tree {
                max-width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                border-left: none;
                border-top: 2px solid var(--bg-purple);
                border-radius: 0 0 20px 20px;
                padding: 10px;
                gap: 5px;
                max-height: 150px;
                overflow-y: auto;
            }
            .milestone { padding: 5px 10px; font-size: 0.9rem; border-radius: 20px; background: rgba(255,255,255,0.1); margin: 2px;}
            .milestone .m-val { display: none; } /* Ẩn số tiền trên mobile để gọn */
            .options-grid { grid-template-columns: 1fr; }
            .question-box { font-size: 1.2rem; padding: 15px 20px; min-height: 80px;}
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Canvas Pháo hoa -->
    <canvas id="fireworks"></canvas>

    <!-- App Container -->
    <div id="app">

        <div id="start-screen" class="screen">
            <div class="title-icon">🎓</div>
            <h1>Ai Là Triệu Phú</h1>
            <h2>BÀI 7</h2>
            <h3>THỨ TỰ THỰC HIỆN CÁC PHÉP TÍNH</h3>
            <button class="btn-main" onclick="startGame()">Bắt đầu</button>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="main-panel">
                <div class="top-bar">
                    <div class="lifelines">
                        <button id="btn-5050" class="lifeline-btn" onclick="use5050()" title="50:50">50:50</button>
                        <button id="btn-audience" class="lifeline-btn" onclick="useAudience()" title="Hỏi ý kiến khán giả">👥</button>
                        <button id="btn-expert" class="lifeline-btn" onclick="useExpert()" title="Hỏi chuyên gia">🧠</button>
                    </div>
                    <div class="timer-container">
                        <svg class="timer-svg" width="80" height="80">
                            <circle class="timer-circle" cx="40" cy="40" r="36"></circle>
                        </svg>
                        <div id="timer-text" class="timer-text">30</div>
                    </div>
                </div>

                <div class="question-container">
                    <div id="question-text" class="question-box">Đang tải câu hỏi...</div>
                    <div class="options-grid">
                        <button class="option-btn" onclick="selectOption(0)"><span class="option-letter">A:</span><span id="opt-0"></span></button>
                        <button class="option-btn" onclick="selectOption(1)"><span class="option-letter">B:</span><span id="opt-1"></span></button>
                        <button class="option-btn" onclick="selectOption(2)"><span class="option-letter">C:</span><span id="opt-2"></span></button>
                        <button class="option-btn" onclick="selectOption(3)"><span class="option-letter">D:</span><span id="opt-3"></span></button>
                    </div>
                </div>
            </div>

            <!-- Cây tiền thưởng -->
            <div class="money-tree" id="money-tree">
                <!-- Sẽ được tạo bằng JS -->
            </div>
        </div>

        <div id="end-screen" class="screen hidden">
            <div id="end-icon" class="title-icon"></div>
            <h1 id="end-title"></h1>
            <h2 id="end-message"></h2>
            <button class="btn-main" style="margin-top: 30px;" onclick="initGame()">Chơi lại</button>
        </div>

        <!-- Modal Giải thích khi Sai -->
        <div id="modal-explain" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-title" style="color: #ff4444;">Rất tiếc! Đáp án chưa chính xác</div>
                <div id="explain-text" class="modal-body" style="text-align: left;"></div>
                <button class="btn-main" onclick="closeExplainAndLose()">Câu tiếp theo</button>
            </div>
        </div>

        <!-- Modal Khán giả -->
        <div id="modal-audience" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-title">Ý kiến khán giả trường quay</div>
                <div class="chart-container" id="audience-chart">
                    <!-- JS generated bars -->
                </div>
                <button class="btn-main" onclick="closeModal('modal-audience')">Cảm ơn</button>
            </div>
        </div>

        <!-- Modal Chuyên gia -->
        <div id="modal-expert" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-title">Tư vấn từ Chuyên gia Toán học</div>
                <div id="expert-text" class="modal-body" style="font-style: italic;"></div>
                <button class="btn-main" onclick="closeModal('modal-expert')">Cảm ơn</button>
            </div>
        </div>
    </div>

    <script>
        /* Mảng chứa toàn bộ dữ liệu 15 câu hỏi Toán 6 - Bài 7 */
        const questions = [
            // PHẦN I: NHẬN BIẾT
            {
                q: "Khi thực hiện phép tính đối với biểu thức chỉ có phép tính cộng và trừ (hoặc chỉ có phép tính nhân và chia), ta thực hiện theo thứ tự nào đúng?",
                options: ["Thực hiện từ phải sang trái.", "Thực hiện từ trái sang phải.", "Thực hiện phép cộng trước, phép trừ sau.", "Thực hiện phép tính nào trước cũng được."],
                correct: 1,
                explain: "Theo quy tắc: Nếu biểu thức chỉ có phép tính cộng, trừ (hoặc nhân, chia), ta thực hiện lần lượt từ trái sang phải."
            },
            {
                q: "Đối với biểu thức không có dấu ngoặc, nếu có cả các phép tính cộng, trừ, nhân, chia và nâng lên lũy thừa thì thứ tự thực hiện đúng là gì?",
                options: ["Cộng và trừ → Nhân và chia → Lũy thừa.", "Nhân và chia → Lũy thừa → Cộng và trừ.", "Lũy thừa → Nhân và chia → Cộng và trừ.", "Lũy thừa → Cộng và trừ → Nhân và chia."],
                correct: 2,
                explain: "Thứ tự ưu tiên đúng đối với biểu thức không có ngoặc là: Lũy thừa → Nhân và chia → Cộng và trừ."
            },
            {
                q: "Khi biểu thức có các dấu ngoặc: ngoặc tròn ( ), ngoặc vuông [ ], ngoặc nhọn { }, thứ tự thực hiện các phép tính trong ngoặc là:",
                options: ["{ } → [ ] → ( )", "( ) → [ ] → { }", "[ ] → ( ) → { }", "Thích thực hiện ngoặc nào trước cũng được."],
                correct: 1,
                explain: "Khi biểu thức có nhiều loại dấu ngoặc, ta thực hiện phép tính trong ngoặc tròn ( ) trước, rồi đến ngoặc vuông [ ], cuối cùng là ngoặc nhọn { }."
            },
            {
                q: "Để tính giá trị biểu thức 5 + 3 x 2, bạn Tròn tính ra 16, bạn Vuông tính ra 11. Theo quy tắc toán học, bạn nào đúng?",
                options: ["Bạn Tròn đúng.", "Bạn Vuông đúng.", "Cả hai bạn đều đúng.", "Cả hai bạn đều sai."],
                correct: 1,
                explain: "Phép tính 5 + 3 x 2 có cả phép cộng và phép nhân, ta phải thực hiện nhân trước cộng sau: 5 + 3 x 2 = 5 + 6 = 11. Do đó bạn Vuông đúng."
            },
            // PHẦN II: THÔNG HIỂU
            {
                q: "Kết quả của phép tính 100 : 5 x 2 là:",
                options: ["10", "4", "40", "100"],
                correct: 2,
                explain: "Biểu thức chỉ gồm phép chia và nhân nên thực hiện từ trái sang phải: 100 : 5 x 2 = 20 x 2 = 40."
            },
            {
                q: "Tính giá trị biểu thức sau: 42 - 30 + 8.",
                options: ["4", "20", "16", "22"],
                correct: 1,
                explain: "Chỉ gồm phép trừ và cộng nên thực hiện từ trái sang phải: 42 - 30 + 8 = 12 + 8 = 20."
            },
            {
                q: "Tính giá trị biểu thức: 1 + 2 x 3<sup>2</sup>.",
                options: ["45", "19", "27", "15"],
                correct: 1,
                explain: "Thực hiện lũy thừa trước, nhân tiếp theo, rồi đến phép cộng: 1 + 2 x 9 = 1 + 18 = 19."
            },
            {
                q: "Kết quả của phép tính (10 + 5) : 5 là:",
                options: ["3", "11", "7", "1"],
                correct: 0,
                explain: "Thực hiện phép tính trong ngoặc tròn trước: (10 + 5) : 5 = 15 : 5 = 3."
            },
            {
                q: "Tính giá trị của biểu thức 14 + 2 x 8<sup>2</sup>.",
                options: ["1024", "142", "100", "128"],
                correct: 1,
                explain: "Tính lũy thừa trước: 8<sup>2</sup> = 64. Tiếp theo nhân: 2 x 64 = 128. Cuối cùng cộng: 14 + 128 = 142."
            },
            {
                q: "Tính giá trị của biểu thức 235 + 78 - 142.",
                options: ["171", "271", "313", "142"],
                correct: 0,
                explain: "Tính từ trái sang phải: 235 + 78 - 142 = 313 - 142 = 171."
            },
            // PHẦN III: VẬN DỤNG
            {
                q: "Giá trị của biểu thức {15 + 2 x [8 - (5 - 3)]} : 9 bằng:",
                options: ["1", "2", "3", "4"],
                correct: 2,
                explain: "Ngoặc tròn: 5-3=2. Ngoặc vuông: 8-2=6. Ngoặc nhọn: 15+2x6 = 15+12=27. Ngoài ngoặc: 27:9 = 3."
            },
            {
                q: "Kết quả phép tính [1 + 2 x (5 x 3 - 2<sup>3</sup>)] x 7 bằng bao nhiêu?",
                options: ["105", "95", "115", "85"],
                correct: 0,
                explain: "Ngoặc tròn: 15 - 8 = 7. Ngoặc vuông: 1 + 2 x 7 = 1 + 14 = 15. Ngoài ngoặc: 15 x 7 = 105."
            },
            {
                q: "Tính giá trị của biểu thức: 2 x 3<sup>2</sup> + 5 x (2 + 3).",
                options: ["38", "43", "28", "48"],
                correct: 1,
                explain: "Lũy thừa và ngoặc tròn: 3<sup>2</sup> = 9; (2+3) = 5. Biểu thức: 2x9 + 5x5 = 18 + 25 = 43."
            },
            {
                q: "Tính giá trị của biểu thức sau: {2<sup>3</sup> + [1 + (3 - 1)<sup>2</sup>]} : 13.",
                options: ["1", "2", "3", "0"],
                correct: 0,
                explain: "Ngoặc tròn: 3-1=2. Ngoặc vuông: 1 + 2<sup>2</sup> = 1+4=5. Ngoặc nhọn: 2<sup>3</sup> + 5 = 8+5=13. Cuối cùng: 13:13 = 1."
            },
            {
                q: "Cho biểu thức 1 + 2(a + b). Hãy tính giá trị của biểu thức này khi a = 25 và b = 9.",
                options: ["59", "69", "79", "68"],
                correct: 1,
                explain: "Thay số: 1 + 2 x (25 + 9). Tính trong ngoặc: 25+9=34. Nhân: 2x34 = 68. Cộng: 1+68 = 69."
            }
        ];

        const milestones = ["100.000", "200.000", "300.000", "500.000", "1.000.000 (Mốc an toàn)", "2.000.000", "3.000.000", "6.000.000", "10.000.000", "14.000.000 (Mốc an toàn)", "22.000.000", "30.000.000", "40.000.000", "60.000.000", "150.000.000 TRIỆU PHÚ"];

        let currentQuestion = 0;
        let timer;
        let timeLeft = 30;
        let isAnswering = false;
        let audioCtx;
        
        let used5050 = false;
        let usedAudience = false;
        let usedExpert = false;

        /* DOM Elements */
        const els = {
            startScreen: document.getElementById('start-screen'),
            gameScreen: document.getElementById('game-screen'),
            endScreen: document.getElementById('end-screen'),
            questionText: document.getElementById('question-text'),
            options: [
                document.getElementById('opt-0').parentElement,
                document.getElementById('opt-1').parentElement,
                document.getElementById('opt-2').parentElement,
                document.getElementById('opt-3').parentElement
            ],
            moneyTree: document.getElementById('money-tree'),
            timerText: document.getElementById('timer-text'),
            timerCircle: document.querySelector('.timer-circle'),
            app: document.getElementById('app')
        };

        function initGame() {
            currentQuestion = 0;
            used5050 = false;
            usedAudience = false;
            usedExpert = false;
            
            document.getElementById('btn-5050').disabled = false;
            document.getElementById('btn-audience').disabled = false;
            document.getElementById('btn-expert').disabled = false;

            els.endScreen.classList.add('hidden');
            els.gameScreen.classList.add('hidden');
            els.startScreen.classList.remove('hidden');
            
            renderMoneyTree();
            clearFireworks();
        }

        function startGame() {
            // Khởi tạo Audio Context khi người dùng tương tác
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            els.startScreen.classList.add('hidden');
            els.gameScreen.classList.remove('hidden');
            loadQuestion();
        }

        function renderMoneyTree() {
            els.moneyTree.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                let div = document.createElement('div');
                div.className = `milestone ${i === 4 || i === 9 ? 'safe' : ''}`;
                div.id = `milestone-${i}`;
                div.innerHTML = `<span class="m-num">${i + 1}</span><span class="m-val">${milestones[i]}</span>`;
                els.moneyTree.appendChild(div);
            }
        }

        function loadQuestion() {
            isAnswering = false;
            const q = questions[currentQuestion];
            els.questionText.innerHTML = `Câu ${currentQuestion + 1}: ${q.q}`;
            
            els.options.forEach((btn, index) => {
                btn.classList.remove('selected', 'correct', 'wrong', 'hidden-option');
                btn.querySelector('span:nth-child(2)').innerHTML = q.options[index];
                btn.disabled = false;
            });

            // Update Money Tree UI
            document.querySelectorAll('.milestone').forEach((m, idx) => {
                m.classList.remove('current');
                if (idx < currentQuestion) m.classList.add('passed');
            });
            document.getElementById(`milestone-${currentQuestion}`).classList.add('current');

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 30;
            updateTimerUI();
            
            timer = setInterval(() => {
                timeLeft -= 0.1; // Smooth update
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateTimerUI();
                    clearInterval(timer);
                    timeOut();
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function updateTimerUI() {
            els.timerText.innerText = Math.ceil(timeLeft);
            // Chu vi hình tròn r=36 là ~226
            const offset = 226 - (timeLeft / 30) * 226;
            els.timerCircle.style.strokeDashoffset = offset;
            
            if (timeLeft <= 5) els.timerCircle.style.stroke = 'red';
            else els.timerCircle.style.stroke = 'var(--gold)';
        }

        function selectOption(index) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timer);
            
            // Disable tất cả options
            els.options.forEach(btn => btn.disabled = true);
            
            // Hiệu ứng chọn
            const selectedBtn = els.options[index];
            selectedBtn.classList.add('selected');

            // Giả lập độ trễ hồi hộp
            setTimeout(() => {
                checkAnswer(index);
            }, 1500);
        }

        function timeOut() {
            isAnswering = true;
            els.options.forEach(btn => btn.disabled = true);
            const correctIdx = questions[currentQuestion].correct;
            els.options[correctIdx].classList.add('correct');
            showWrongEffect();
        }

        function checkAnswer(selectedIndex) {
            const correctIndex = questions[currentQuestion].correct;
            const selectedBtn = els.options[selectedIndex];
            const correctBtn = els.options[correctIndex];

            selectedBtn.classList.remove('selected');

            if (selectedIndex === correctIndex) {
                // Đúng
                selectedBtn.classList.add('correct');
                playTingSound();
                createMiniFireworks();
                
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion < 15) {
                        loadQuestion();
                    } else {
                        showWinScreen();
                    }
                }, 2500);
            } else {
                // Sai
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
                showWrongEffect();
            }
        }

        function showWrongEffect() {
            els.app.classList.add('shake-effect');
            setTimeout(() => {
                els.app.classList.remove('shake-effect');
                // Hiện bảng giải thích
                document.getElementById('explain-text').innerHTML = questions[currentQuestion].explain;
                document.getElementById('modal-explain').classList.add('active');
            }, 500);
        }

        function closeExplainAndLose() {
            closeModal('modal-explain');
            showLoseScreen();
        }

        function showWinScreen() {
            els.gameScreen.classList.add('hidden');
            els.endScreen.classList.remove('hidden');
            
            document.getElementById('end-icon').innerHTML = "🏆";
            document.getElementById('end-title').innerHTML = "CHÚC MỪNG!";
            document.getElementById('end-message').innerHTML = "Bạn đã trở thành<br><span style='color:var(--gold); font-size: 2rem'>TRIỆU PHÚ TOÁN HỌC</span>";
            startBigFireworks();
        }

        function showLoseScreen() {
            els.gameScreen.classList.add('hidden');
            els.endScreen.classList.remove('hidden');
            
            document.getElementById('end-icon').innerHTML = "💔";
            document.getElementById('end-title').innerHTML = "KẾT THÚC";
            let moneyStr = currentQuestion > 0 ? milestones[currentQuestion-1].split(" ")[0] : "0";
            document.getElementById('end-message').innerHTML = `Cảm ơn bạn đã tham gia!<br>Vượt qua: Câu ${currentQuestion}`;
        }

        function use5050() {
            if (used5050 || isAnswering) return;
            used5050 = true;
            document.getElementById('btn-5050').disabled = true;

            const correctIdx = questions[currentQuestion].correct;
            let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
            
            // Randomly hide 2 wrong answers
            wrongIndices.sort(() => Math.random() - 0.5);
            els.options[wrongIndices[0]].classList.add('hidden-option');
            els.options[wrongIndices[1]].classList.add('hidden-option');
        }

        function useAudience() {
            if (usedAudience || isAnswering) return;
            usedAudience = true;
            document.getElementById('btn-audience').disabled = true;

            const correctIdx = questions[currentQuestion].correct;
            let percentages = [0, 0, 0, 0];
            
            // Generate percentages favoring the correct answer (40-70%)
            let correctPct = Math.floor(Math.random() * 30) + 40; 
            percentages[correctIdx] = correctPct;
            
            let remain = 100 - correctPct;
            for (let i = 0; i < 4; i++) {
                if (i !== correctIdx) {
                    if (els.options[i].classList.contains('hidden-option')) {
                        percentages[i] = 0; // If 50:50 was used
                    } else {
                        // Distribute remaining
                        let p = Math.floor(Math.random() * (remain / 2));
                        percentages[i] = p;
                        remain -= p;
                    }
                }
            }
            // Add any left over to a valid random wrong option
            let validWrongs = [0,1,2,3].filter(i => i !== correctIdx && !els.options[i].classList.contains('hidden-option'));
            if(validWrongs.length > 0) {
                percentages[validWrongs[0]] += remain;
            } else {
                 percentages[correctIdx] += remain;
            }

            // Render Chart
            const chartDiv = document.getElementById('audience-chart');
            chartDiv.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            
            for(let i=0; i<4; i++) {
                const group = document.createElement('div');
                group.className = 'bar-group';
                group.innerHTML = `
                    <div class="bar-pct">${percentages[i]}%</div>
                    <div class="bar" style="height: 0px;" data-h="${percentages[i]}"></div>
                    <div class="bar-label">${labels[i]}</div>
                `;
                chartDiv.appendChild(group);
            }

            document.getElementById('modal-audience').classList.add('active');
            
            // Animate bars after a short delay
            setTimeout(() => {
                document.querySelectorAll('.bar').forEach(bar => {
                    bar.style.height = bar.getAttribute('data-h') + 'px';
                });
            }, 100);
        }

        function useExpert() {
            if (usedExpert || isAnswering) return;
            usedExpert = true;
            document.getElementById('btn-expert').disabled = true;

            const correctIdx = questions[currentQuestion].correct;
            const labels = ['A', 'B', 'C', 'D'];
            const explain = questions[currentQuestion].explain;

            document.getElementById('expert-text').innerHTML = 
                `"Chào bạn, tôi chắc chắn đáp án đúng là <strong>${labels[correctIdx]}</strong>. Bởi vì: <br><br> ${explain}"`;
            
            document.getElementById('modal-expert').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function playTingSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note A5
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // Slide up
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let fireworksAnimId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.size = Math.random() * 3 + 1;
            }
            update() {
                this.vy += 0.05; // gravity
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, isBig = false) {
            const count = isBig ? 150 : 50;
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff'];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function createMiniFireworks() {
            createExplosion(window.innerWidth / 2, window.innerHeight - 100, false);
            animateFireworks();
        }

        function startBigFireworks() {
            let fwInterval = setInterval(() => {
                createExplosion(Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.6, true);
            }, 800);
            animateFireworks();
            // Stop generating after 10s
            setTimeout(() => clearInterval(fwInterval), 10000);
        }

        function animateFireworks() {
            if (!fireworksAnimId) {
                function loop() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let i = particles.length - 1; i >= 0; i--) {
                        let p = particles[i];
                        p.update();
                        p.draw(ctx);
                        if (p.life <= 0) particles.splice(i, 1);
                    }
                    if (particles.length > 0) {
                        fireworksAnimId = requestAnimationFrame(loop);
                    } else {
                        fireworksAnimId = null;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                }
                loop();
            }
        }

        function clearFireworks() {
            particles = [];
            if (fireworksAnimId) cancelAnimationFrame(fireworksAnimId);
            fireworksAnimId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Initialize state on load
        initGame();
    </script>
</body>
</html>
